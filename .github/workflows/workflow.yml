apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: cleanup
spec:
  workspaces:
    - name: source
  steps:
    - name: cleanup
      image: alpine:3.19
      script: |
        #!/bin/sh
        echo "Cleaning workspace..."
        rm -rf "$(workspaces.source.path)"/*
        echo "Cleanup completed successfully."

---

apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: nose
spec:
  workspaces:
    - name: source
  steps:
    - name: run-nose-tests
      image: python:3.10
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -e
        pip install --no-cache-dir nose
        echo "Running unit tests with nose..."
        nosetests
